name: ニュース取得

on:
  schedule:
    # 10分ごと（GitHub Actions の最短は5分。混雑時は数分ずれることがあります）
    - cron: '*/10 * * * *'
  workflow_dispatch: # 手動実行用
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ニュースを取得して docs/ を更新
        run: node scripts/build-site.js

      - name: 1枚で完結するHTMLも書き出す
        run: node scripts/build-standalone.js

      # docs/ を main に押し込むと、GitHub Pages（Deploy from a branch = main / docs）が
      # 自動で配信し直す。Pages 側の設定は一度だけ画面から行う。
      - name: 変更があればコミット
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --staged --quiet; then
            echo '更新はありませんでした'
          else
            git commit -m "ニュースを更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
