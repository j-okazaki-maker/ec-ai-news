name: ニュース取得と公開

on:
  schedule:
    # 30分ごと（GitHub の都合で数分ずれることがあります）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 手動実行用
  push:
    branches: [main]

permissions:
  contents: write # docs/ の更新をコミットする
  pages: write # GitHub Pages へ配信する
  id-token: write # Pages のデプロイに必要

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ニュースを取得して docs/ を更新
        run: node scripts/build-site.js

      - name: 1枚で完結するHTMLも書き出す
        run: node scripts/build-standalone.js

      - name: 変更があればコミット
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --staged --quiet; then
            echo '更新はありませんでした'
          else
            git commit -m "ニュースを更新 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            # 取得の実行中に別のコミットが入ることがあるので、取り込んでから押し込む
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Pages が未設定なら enablement: true が有効化する（設定画面の操作が要らない）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
